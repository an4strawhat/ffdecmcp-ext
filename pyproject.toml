[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffdecmcp"
version = "0.2.1"
description = "MCP wrapper for JPEXS Free Flash Decompiler (FFDec) - extended fork with full SWF CLI coverage (decompile, edit, convert) for AI assistants. Source install only (not published on PyPI)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "an4strawhat" }
]
keywords = ["mcp", "ffdec", "swf", "flash", "decompiler", "actionscript"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.14.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/an4strawhat/ffdecmcp-ext"
Repository = "https://github.com/an4strawhat/ffdecmcp-ext"
Issues = "https://github.com/an4strawhat/ffdecmcp-ext/issues"
Upstream = "https://github.com/sublimnl/ffdecmcp"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ffdecmcp = "ffdecmcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ffdecmcp = ["py.typed"]
